version: 2.1
jobs:
  compile:
   docker:
      - image: xyzuan/xdocker:latest
   steps:
      - run:
          command: |
            git clone --recursive https://github.com/aslenolineagestuff/msm-4.4 -b kernel.lnx.4.4.r42-rel kernel && cd kernel
            curl -s https://raw.githubusercontent.com/aslenofarid/Kernel_Builder_CI_LV_S/LV-S/build.sh | bash
          no_output_timeout : 5h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
